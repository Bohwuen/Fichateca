<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fichateca - Mis fichas</title>
    <link rel="stylesheet" href="../../css/estilos.css">
</head>
<body>

    <header>
        <img src="../../imagenes/Wow Logo 1.png" alt="Fichateca" class="logo">
    </header>

    <nav id="nav-principal" class="nav-principal"></nav>

    <div id="barra-sesion" class="barra-sesion"></div>

    <main class="contenedor">
        <h1>Mis fichas</h1>
        <p><a href="../perfil.html">← Volver al perfil</a></p>

        <p>
            <a href="ficha.html"><button type="button">Crear nueva ficha</button></a>
        </p>

        <div id="lista-fichas"><em>Cargando…</em></div>
    </main>

    <footer>
        <a rel="license" href="http://creativecommons.org/licenses/by-nc-nd/4.0/">
            <img alt="Licencia Creative Commons" style="border-width:0"
                 src="https://i.creativecommons.org/l/by-nc-nd/4.0/88x31.png">
        </a><br>
        Esta obra está bajo una
        <a rel="license" href="http://creativecommons.org/licenses/by-nc-nd/4.0/">
            Licencia Creative Commons Atribución-NoComercial-SinDerivadas 4.0 Internacional
        </a>.
    </footer>

    <script>window.RUTA_BASE = "../../";</script>
    <script src="../../js/comun.js"></script>
    <script src="../../js/csv.js"></script>
    <script src="../../js/motor.js"></script>
    <script>
    document.addEventListener("DOMContentLoaded", function () {

        exigirSesion("../../login/signin.html");
        pintarMenu("../../", "");
        pintarBarraSesion("../../");

        cargarDatosMotor().then(() => {
            pintarLista();
        });

        function pintarLista() {
            const cont = document.getElementById("lista-fichas");
            const fichas = obtenerFichas();

            if (fichas.length === 0) {
                cont.innerHTML = "<p><em>Todavía no has creado ninguna ficha.</em></p>";
                return;
            }

            let html = '<table style="width:100%"><thead><tr>' +
                '<th>Nombre</th><th>Raza</th><th>Clase</th><th>Nivel</th><th>Acciones</th>' +
                '</tr></thead><tbody>';

            fichas.forEach(f => {
                const nombreRaza = nombreDe("razas", f.raza);
                const nombreSub  = f.subraza ? " (" + nombreDe("subrazas", f.subraza) + ")" : "";
                const nombreClase = nombreDe("clases", f.clase);

                html += '<tr>' +
                    '<td>' + escapar((f.nombre || "") + " " + (f.apellidos || "")) + '</td>' +
                    '<td>' + escapar(nombreRaza + nombreSub) + '</td>' +
                    '<td>' + escapar(nombreClase) + '</td>' +
                    '<td>' + (f.nivel || 1) + '</td>' +
                    '<td>' +
                        '<a href="ficha.html?id=' + f.id + '">Editar</a> · ' +
                        '<a href="#" data-borrar="' + f.id + '">Borrar</a>' +
                    '</td>' +
                '</tr>';
            });

            html += '</tbody></table>';
            cont.innerHTML = html;

            // Enlazar borrado
            cont.querySelectorAll("[data-borrar]").forEach(a => {
                a.addEventListener("click", e => {
                    e.preventDefault();
                    if (confirm("¿Seguro que quieres borrar esta ficha?")) {
                        borrarFicha(a.dataset.borrar);
                        pintarLista();
                    }
                });
            });
        }

        function nombreDe(csv, id) {
            if (!id) return "—";
            const fila = DATOS[csv].find(x => x.id === id);
            return fila ? fila.nombre : id;
        }

    });
    </script>
</body>
</html>
