<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fichateca - Mis fichas</title>
    <link rel="stylesheet" href="../../css/estilos.css">
</head>
<body>

    <header>
        <img src="../../imagenes/Wow_Logo_1.png" alt="Fichateca" class="logo">
    </header>

    <nav id="nav-principal" class="nav-principal"></nav>

    <div id="barra-sesion" class="barra-sesion"></div>

    <main class="contenedor">
        <h1>Mis fichas</h1>
        <p><a href="../perfil.html">← Volver al perfil</a></p>

        <p>
            <a href="ficha.html"><button type="button">Crear nueva ficha</button></a>
        </p>

        <div id="lista-fichas"><em>Cargando…</em></div>
    </main>

    <footer>
        <a rel="license" href="http://creativecommons.org/licenses/by-nc-nd/4.0/">
            <img alt="Licencia Creative Commons" style="border-width:0"
                 src="https://i.creativecommons.org/l/by-nc-nd/4.0/88x31.png">
        </a><br>
        Esta obra está bajo una
        <a rel="license" href="http://creativecommons.org/licenses/by-nc-nd/4.0/">
            Licencia Creative Commons Atribución-NoComercial-SinDerivadas 4.0 Internacional
        </a>.
    </footer>

    <script>window.RUTA_BASE = "../../";</script>
    <script src="../../js/comun.js"></script>
    <script src="../../js/csv.js"></script>
    <script src="../../js/motor.js"></script>
    <script>
    document.addEventListener("DOMContentLoaded", function () {

        exigirSesion("../../login/signin.html");
        pintarMenu("../../", "");
        pintarBarraSesion("../../");

        cargarDatosMotor().then(() => {
            pintarLista();
        });

        function pintarLista() {
            const Contenedor = document.getElementById("lista-fichas");
            const Fichas = obtenerFichas();

            if (Fichas.length === 0) {
                Contenedor.innerHTML = "<p><em>Todavía no has creado ninguna ficha.</em></p>";
                return;
            }

            let Html = '<table style="width:100%"><thead><tr>' +
                '<th>Nombre</th><th>Raza</th><th>Clase</th><th>Nivel</th><th>Acciones</th>' +
                '</tr></thead><tbody>';

            Fichas.forEach(Ficha => {
                const NombreRaza = nombreDe("razas", Ficha.raza);
                const NombreSub  = Ficha.subraza ? " (" + nombreDe("subrazas", Ficha.subraza) + ")" : "";
                const NombreClase = nombreDe("clases", Ficha.clase);

                Html += '<tr>' +
                    '<td>' + escapar((Ficha.nombre || "") + " " + (Ficha.apellidos || "")) + '</td>' +
                    '<td>' + escapar(NombreRaza + NombreSub) + '</td>' +
                    '<td>' + escapar(NombreClase) + '</td>' +
                    '<td>' + (Ficha.nivel || 1) + '</td>' +
                    '<td>' +
                        '<a href="ficha.html?id=' + Ficha.id + '">Editar</a> · ' +
                        '<a href="#" data-borrar="' + Ficha.id + '">Borrar</a>' +
                    '</td>' +
                '</tr>';
            });

            Html += '</tbody></table>';
            Contenedor.innerHTML = Html;

            // Enlazar borrado
            Contenedor.querySelectorAll("[data-borrar]").forEach(Enlace => {
                Enlace.addEventListener("click", Evento => {
                    Evento.preventDefault();
                    if (confirm("¿Seguro que quieres borrar esta ficha?")) {
                        borrarFicha(Enlace.dataset.borrar);
                        pintarLista();
                    }
                });
            });
        }

        function nombreDe(Csv, Id) {
            if (!Id) return "—";
            const Fila = Datos[Csv].find(Elemento => Elemento.id === Id);
            return Fila ? Fila.nombre : Id;
        }

    });
    </script>
</body>
</html>
