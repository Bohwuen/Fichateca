<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fichateca - Iniciar sesión</title>
    <link rel="stylesheet" href="../css/estilos.css">
</head>
<body>

    <header>
        <img src="../imagenes/Wow_Logo_1.png" alt="Fichateca" class="logo">
    </header>

    <nav id="nav-principal" class="nav-principal"></nav>

    <div id="barra-sesion" class="barra-sesion"></div>

    <main class="contenedor">
        <h1>Iniciar sesión</h1>
        <p><em>(Login ficticio: cualquier nombre sirve. Se guarda en tu navegador.)</em></p>

        <form id="form-signin">
            <p>
                <label for="usuario">Nombre de usuario:</label><br>
                <input type="text" id="usuario" name="usuario" required autofocus>
            </p>
            <p>
                <label for="pass">Contraseña:</label><br>
                <input type="password" id="pass" name="pass" required>
            </p>
            <p>
                <button type="submit">Entrar</button>
            </p>
        </form>

        <p>¿No tienes cuenta? <a href="signup.html">Crea una</a></p>
    </main>

    <footer>
        <a rel="license" href="http://creativecommons.org/licenses/by-nc-nd/4.0/">
            <img alt="Licencia Creative Commons" style="border-width:0"
                 src="https://i.creativecommons.org/l/by-nc-nd/4.0/88x31.png">
        </a><br>
        Esta obra está bajo una
        <a rel="license" href="http://creativecommons.org/licenses/by-nc-nd/4.0/">
            Licencia Creative Commons Atribución-NoComercial-SinDerivadas 4.0 Internacional
        </a>.
    </footer>

    <script src="../js/comun.js"></script>
    <script>
        pintarMenu("../", "");
        pintarBarraSesion("../");

        document.getElementById("form-signin").addEventListener("submit", function (e) {
            e.preventDefault();
            const nombre = document.getElementById("usuario").value.trim();
            if (!nombre) return;
            iniciarSesion(nombre);
            window.location.href = "../usuario/perfil.html";
        });
    </script>
</body>
</html>
