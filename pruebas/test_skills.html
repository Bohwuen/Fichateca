<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Test Skill Sheet DiceMaster</title>
    <style>
        body { font-family: sans-serif; padding: 2em; max-width: 900px; }
        textarea { width: 100%; height: 200px; font-family: monospace; font-size: 11px; }
        button { padding: 0.4em 0.8em; cursor: pointer; }
        .ok { color: green; }
    </style>
</head>
<body>
    <h1>Test: Skill Sheet DiceMaster</h1>
    <p>Raza: Humano de Dalaran · Clase: Mago · Nivel 5</p>
    <div id="contenedor">Cargando…</div>

    <script>window.RUTA_BASE = "../";</script>
    <script src="../js/comun.js"></script>
    <script src="../js/csv.js"></script>
    <script src="../js/motor.js"></script>
    <script src="../js/lua.js"></script>
    <script src="../js/dicemaster.js"></script>
    <script>
        cargarDatosMotor().then(() => {
            const Ficha = {
                raza: "humano",
                subraza: "humano_dalaran",
                clase: "mago",
                transformacion: "",
                nivel: 5,
                atributos: {
                    vigor: 2, destreza: 3, inteligencia: 4, voluntad: 2,
                    percepcion: 3, carisma: 2, aguante: 2, energia: 3
                },
                defensas: {
                    parada_bloqueo: 1, esquivar: 2, metamagia: 3
                },
                habilidades: {
                    atletismo: 2, sigilo: 1, juego_de_manos: 0,
                    subsistencia: 1, acrobacias: 0, buscar: 2, alerta: 1,
                    aprendizaje: 3, interpretacion: 0, subterfugio: 0,
                    trato_con_animales: 0, intimidacion: 1, diplomacia: 2
                },
                magia: {
                    taumaturgia: 3, fe: 0, espiritualidad: 0,
                    naturaleza: 0, caos: 1
                },
                armasHabilidades: [
                    { id: "espadas_1m", valor: 2 },
                    { id: "bastones", valor: 3 },
                    { id: "varitas", valor: 1 }
                ],
                actual: { armadura: 5, saludExtra: 0, energiaExtra: 0 },
                pools: { pa: 5, pd: 3, ph: 10, phm: 1, pmye: 3, pha: 5, ppo: 2, pco: 5 }
            };

            const Sheet = generarSkillSheet(Ficha);

            const Lua = jsALua(Sheet);
            const Base64 = base64Encode(Lua);

            let Html = `<p>Total skills: ${Sheet.length}</p>`;
            Html += `<p>Longitud Base64: ${Base64.length} caracteres</p>`;
            Html += `<textarea readonly id="b64">${Base64}</textarea>`;
            Html += `<p><button id="btn-copiar">📋 Copiar Base64</button> <span id="feedback" class="ok"></span></p>`;
            Html += `<details><summary>Ver Lua generado</summary><pre style="background:#f4f4f4;padding:1em;overflow:auto;max-height:400px">${escaparHtml(Lua)}</pre></details>`;

            document.getElementById("contenedor").innerHTML = Html;

            document.getElementById("btn-copiar").addEventListener("click", () => {
                const Txt = document.getElementById("b64");
                Txt.select();
                Txt.setSelectionRange(0, 999999);
                navigator.clipboard.writeText(Txt.value).then(() => {
                    document.getElementById("feedback").textContent = "✅ Copiado";
                    setTimeout(() => { document.getElementById("feedback").textContent = ""; }, 2000);
                });
            });
        }).catch(Err => {
            document.getElementById("contenedor").innerHTML =
                '<p style="color:red">Error: ' + Err.message + '</p>';
        });

        function escaparHtml(T) {
            return String(T).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
</body>
</html>
