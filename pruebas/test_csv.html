<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Test CSV + Motor</title>
    <style>
        body { font-family: sans-serif; padding: 2em; }
        table { border-collapse: collapse; margin-top: 1em; }
        td, th { border: 1px solid #999; padding: 4px 8px; }
        th { background: #eee; }
        .error { color: red; font-weight: bold; }
        pre { background: #f4f4f4; padding: 1em; }
    </style>
</head>
<body>
    <h1>Test: CSVs + Motor</h1>
    <div id="salida">Cargando…</div>

    <script>window.RUTA_BASE = "../";</script>
    <script src="../js/comun.js"></script>
    <script src="../js/csv.js"></script>
    <script src="../js/motor.js"></script>
    <script>
        cargarDatosMotor().then(() => {
            let Html = "<p>✅ CSVs cargados correctamente.</p>";
            Html += "<p>Razas: " + Datos.razas.length + "</p>";
            Html += "<p>Subrazas: " + Datos.subrazas.length + "</p>";
            Html += "<p>Clases: " + Datos.clases.length + "</p>";
            Html += "<p>Bonos raciales: " + Datos.bonosRaciales.length + "</p>";
            Html += "<p>Bonos de clase: " + Datos.bonosClase.length + "</p>";

            const Ejemplo = calcularBonos({
                raza: "humano",
                subraza: "humano_ventormenta",
                clase: "guerrero",
                transformacion: ""
            });
            html += "<p>Bonos de Humano de Ventormenta + Guerrero:</p>";
            Html += "<pre>" + JSON.stringify(Ejemplo, null, 2) + "</pre>";

            document.getElementById("salida").innerHTML = Html;
        }).catch(Error => {
            document.getElementById("salida").innerHTML =
                '<p class="error">Error: ' + Error.message + '</p>';
        });
    </script>
</body>
</html>
